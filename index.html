<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Performance Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- ApexCharts (Core Only) -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <!-- Markdown Parser (Marked) for AI responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .glass-input:focus {
            border-color: #10b981;
            outline: none;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        .prose h3 { font-size: 1.1rem; font-weight: bold; color: #e2e8f0; margin-top: 1rem; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.6; color: #cbd5e1; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .prose strong { color: #fbbf24; font-weight: 600; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const div = (a, b) => b === 0 ? 0 : a / b;

        const fetchArchives = async (username) => {
            const response = await fetch(`https://api.chess.com/pub/player/${username}/games/archives`);
            if (!response.ok) throw new Error("User not found or API error");
            const data = await response.json();
            return data.archives; 
        };

        const fetchGamesFromUrl = async (url) => {
            const response = await fetch(url);
            const data = await response.json();
            return data.games;
        };

        const fetchGeminiAnalysis = async (apiKey, stats, username, mode, modelName, customInstruction) => {
            const formatTimeStat = (period, data) => 
                `- ${period}: ${data.games} games, Win Rate ${(div(data.wins, data.games)*100).toFixed(1)}%`;

            const timeStatsText = `
            ${formatTimeStat('Morning (06:00-12:00)', stats.timeStats.morning)}
            ${formatTimeStat('Afternoon (12:00-18:00)', stats.timeStats.afternoon)}
            ${formatTimeStat('Evening (18:00-24:00)', stats.timeStats.evening)}
            ${formatTimeStat('Night (00:00-06:00)', stats.timeStats.night)}
            `;

            const prompt = `
            Act as a professional Chess Coach and Data Analyst. Analyze the following performance data for player "${username}" in "${mode}" time control.
            
            Stats Overview:
            - Current Rating: ${stats.currentRating}
            - Peak Rating (Period): ${stats.highestRating}
            - Floor Rating (Period): ${stats.lowestRating}
            - Total Games Analyzed: ${stats.totalGames}
            - Global Win Rate: ${stats.winRateGlobal}%
            
            Time of Day Performance:
            ${timeStatsText}

            Daily Trend Data (Full Period - Date: Volume, PerfRating, NetChange):
            ${stats.chartData.map(d => `- ${new Date(d.x).toLocaleDateString()}: Vol=${d.volume}, PerfRating=${d.perfRating}, NetChange=${d.netChange}`).join('\n')}

            Look at the correlation between Volume, win percentage, and Performance Rating/Net Change. Look for the effects of performance on the number of game played for the period provided.
            
            Standard Report Sections:
            1. **Performance Trend:** Climbing, crashing, or plateauing? Is the volatility usual or reckless?
            2. **Tilt Analysis:** Do high-volume days correlate with losses (tilt) or wins (grinding)? 
            3. **Time of Day Effect:** Does performance significantly drop during specific times?
            4. **Behavior:** Is the player "more careful" when doing well, and more reckless when losing?
            5. **Coaching Tip:** One actionable advice based on this data.
            
            ${customInstruction ? `\nSPECIAL USER REQUEST/QUESTION: ${customInstruction}\nPlease prioritize addressing the above request in your analysis.` : ""}
            
            Keep tone encouraging but objective. Use Markdown formatting.
            `;

            const callApi = async (retryCount = 0) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const resData = await response.json();
                    
                    if (!response.ok) {
                        const message = resData.error?.message || "Unknown API Error";
                        if (message.toLowerCase().includes("quota") || response.status === 429) {
                            throw new Error(`Quota Exceeded: ${message}. Try gemini-1.5-flash-8b or wait for the cooldown.`);
                        }
                        throw new Error(`Model "${modelName}" error: ${message}`);
                    }
                    return resData;
                } catch (error) {
                    if (retryCount < 3 && (error.message.includes("429") || error.message.includes("fetch"))) {
                        const delay = Math.pow(2, retryCount) * 1000;
                        await new Promise(res => setTimeout(res, delay));
                        return callApi(retryCount + 1);
                    }
                    throw error;
                }
            };

            const result = await callApi();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "No analysis generated.";
        };

        const ReactApexChart = ({ options, series, type, height }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                chartInstance.current = new ApexCharts(chartRef.current, { ...options, series, chart: { ...options.chart, type, height } });
                chartInstance.current.render();
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, []);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.updateOptions({ ...options, series, chart: { ...options.chart, type, height } });
                }
            }, [options, series, type, height]);

            return <div ref={chartRef} />;
        };

        const Card = ({ children, className = "" }) => (
            <div className={`glass-panel rounded-xl p-6 shadow-lg ${className}`}>
                {children}
            </div>
        );

        const StatBox = ({ label, value, subtext, color = "text-white" }) => (
            <div className="flex flex-col">
                <span className="text-slate-400 text-sm font-medium uppercase tracking-wider">{label}</span>
                <span className={`text-2xl font-bold mt-1 ${color}`}>{value}</span>
                {subtext && <span className="text-xs text-slate-500 mt-1">{subtext}</span>}
            </div>
        );

        const ChartSection = ({ title, children, heightClass = "min-h-[300px]" }) => (
            <Card className="h-full flex flex-col">
                <h3 className="text-lg font-semibold mb-4 text-slate-200">{title}</h3>
                <div className={`flex-grow relative ${heightClass}`}>{children}</div>
            </Card>
        );

        const AiModal = ({ isOpen, onClose, onAnalyze, isAnalyzing, analysis, error }) => {
            const [key, setKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [model, setModel] = useState(localStorage.getItem('gemini_selected_model') || 'gemini-2.5-flash');
            const [customInstruction, setCustomInstruction] = useState('');
            const [customModel, setCustomModel] = useState('');
            const [useCustomModel, setUseCustomModel] = useState(false);
            
            if (!isOpen) return null;

            const handleAnalyze = () => {
                const finalModel = useCustomModel ? customModel : model;
                localStorage.setItem('gemini_api_key', key);
                localStorage.setItem('gemini_selected_model', finalModel);
                onAnalyze(key, finalModel, customInstruction);
            };

            const availableModels = [
                { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash (Default)' },
                { id: 'gemini-2.0-flash', name: 'Gemini 2.0 Flash' },
                { id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash' },
                { id: 'gemini-1.5-flash-8b', name: 'Gemini 1.5 Flash-8B' },
                { id: 'gemini-1.5-pro', name: 'Gemini 1.5 Pro' }
            ];

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 border border-slate-700 w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
                        <div className="p-6 border-b border-slate-800 flex justify-between items-center">
                            <h2 className="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">AI Coach Perspective</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto flex-grow">
                            {!analysis && !isAnalyzing && (
                                <div className="space-y-6">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs text-slate-400 uppercase mb-1">API Key</label>
                                            <input 
                                                type="password" 
                                                value={key}
                                                onChange={(e) => {
                                                    setKey(e.target.value);
                                                    localStorage.setItem('gemini_api_key', e.target.value);
                                                }}
                                                placeholder="AIzaSy..."
                                                className="w-full bg-slate-950 border border-slate-600 rounded px-3 py-2 text-white focus:border-purple-500 outline-none"
                                            />
                                            <p className="text-[10px] text-slate-500 mt-2">
                                                Manage keys at <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-purple-400 hover:underline">Google AI Studio</a>.
                                            </p>
                                        </div>
                                        <div>
                                            <div className="flex justify-between mb-1">
                                                <label className="block text-xs text-slate-400 uppercase">Select Model</label>
                                                <button 
                                                    onClick={() => setUseCustomModel(!useCustomModel)}
                                                    className="text-[10px] text-purple-400 hover:text-purple-300"
                                                >
                                                    {useCustomModel ? "Back to list" : "Use manual ID"}
                                                </button>
                                            </div>
                                            {useCustomModel ? (
                                                <input 
                                                    type="text"
                                                    value={customModel}
                                                    onChange={(e) => setCustomModel(e.target.value)}
                                                    placeholder="e.g. gemini-2.5-flash"
                                                    className="w-full bg-slate-950 border border-slate-600 rounded px-3 py-2 text-white focus:border-purple-500 outline-none"
                                                />
                                            ) : (
                                                <select 
                                                    value={model}
                                                    onChange={(e) => {
                                                        setModel(e.target.value);
                                                        localStorage.setItem('gemini_selected_model', e.target.value);
                                                    }}
                                                    className="w-full bg-slate-950 border border-slate-600 rounded px-3 py-2 text-white focus:border-purple-500 outline-none"
                                                >
                                                    {availableModels.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                                </select>
                                            )}
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 uppercase mb-1">Custom Coaching Questions</label>
                                            <textarea 
                                                value={customInstruction}
                                                onChange={(e) => setCustomInstruction(e.target.value)}
                                                placeholder="Ask specifically about your data (e.g. Why did my performance drop on Tuesdays? Is my volatility improving?)"
                                                className="w-full bg-slate-950 border border-slate-600 rounded px-3 py-2 text-white focus:border-purple-500 outline-none h-24 resize-none text-sm"
                                            />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {isAnalyzing && (
                                <div className="flex flex-col items-center justify-center py-12 space-y-4">
                                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-500"></div>
                                    <p className="text-purple-300 animate-pulse text-sm">Consulting the Coach...</p>
                                </div>
                            )}

                            {error && (
                                <div className="bg-red-500/10 border border-red-500/50 text-red-200 p-4 rounded-lg text-xs leading-relaxed">
                                    <strong className="block mb-1 text-red-400">Analysis Error:</strong>
                                    {error}
                                </div>
                            )}

                            {analysis && (
                                <div className="prose prose-invert prose-sm max-w-none" dangerouslySetInnerHTML={{ __html: marked.parse(analysis) }}></div>
                            )}
                        </div>

                        <div className="p-6 border-t border-slate-800 flex justify-end gap-3">
                            <button onClick={onClose} className="px-4 py-2 text-slate-400 hover:text-white transition-colors text-sm">Close</button>
                            {!analysis && (
                                <button 
                                    onClick={handleAnalyze}
                                    disabled={!key || isAnalyzing || (useCustomModel && !customModel)}
                                    className="px-4 py-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white rounded-lg font-bold transition-all shadow-lg shadow-purple-900/20 text-sm"
                                >
                                    Analyze Patterns
                                </button>
                            )}
                            {analysis && (
                                <button 
                                    onClick={() => { setCustomInstruction(''); handleAnalyze(); }}
                                    className="px-4 py-2 border border-slate-700 hover:bg-slate-800 text-white rounded-lg text-sm transition-colors"
                                >
                                    Re-Analyze
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [username, setUsername] = useState(localStorage.getItem('chess_username') || "");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [rawGames, setRawGames] = useState([]);
            const [timeControl, setTimeControl] = useState(localStorage.getItem('chess_time_control') || "rapid");
            const [monthsBack, setMonthsBack] = useState(parseInt(localStorage.getItem('chess_duration')) || 3);
            const [stats, setStats] = useState(null);
            
            const [isAiOpen, setIsAiOpen] = useState(false);
            const [aiAnalyzing, setAiAnalyzing] = useState(false);
            const [aiAnalysis, setAiAnalysis] = useState(null);
            const [aiError, setAiError] = useState(null);

            const handleFetch = async () => {
                if (!username) return;
                setLoading(true); setError(null); setRawGames([]); setStats(null); setAiAnalysis(null);
                
                localStorage.setItem('chess_username', username);
                localStorage.setItem('chess_time_control', timeControl);
                localStorage.setItem('chess_duration', monthsBack.toString());

                try {
                    const archives = await fetchArchives(username);
                    const urls = archives.slice(-monthsBack);
                    const results = await Promise.all(urls.map(url => fetchGamesFromUrl(url)));
                    setRawGames(results.flat());
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (rawGames.length === 0) return;
                const filtered = rawGames.filter(g => g.time_class === timeControl && g.rated === true).sort((a, b) => a.end_time - b.end_time);
                if (filtered.length === 0) {
                    setError(`No rated ${timeControl} games found in the selected period.`);
                    return;
                }

                const dailyMap = new Map();
                const timeStats = { morning: { games: 0, wins: 0 }, afternoon: { games: 0, wins: 0 }, evening: { games: 0, wins: 0 }, night: { games: 0, wins: 0 } };
                const winCodes = ['win'];

                filtered.forEach(game => {
                    const isWhite = game.white.username.toLowerCase() === username.toLowerCase();
                    const player = isWhite ? game.white : game.black;
                    const opponent = isWhite ? game.black : game.white;
                    const dateObj = new Date(game.end_time * 1000);
                    const dateKey = dateObj.toISOString().split('T')[0];
                    const hour = dateObj.getHours();
                    const isWin = winCodes.includes(player.result);

                    if (hour >= 6 && hour < 12) { timeStats.morning.games++; if (isWin) timeStats.morning.wins++; }
                    else if (hour >= 12 && hour < 18) { timeStats.afternoon.games++; if (isWin) timeStats.afternoon.wins++; }
                    else if (hour >= 18) { timeStats.evening.games++; if (isWin) timeStats.evening.wins++; }
                    else { timeStats.night.games++; if (isWin) timeStats.night.wins++; }

                    if (!dailyMap.has(dateKey)) {
                        dailyMap.set(dateKey, { date: dateKey, games: [], wins: 0, losses: 0, draws: 0, opponentRatingSum: 0 });
                    }
                    const d = dailyMap.get(dateKey);
                    d.games.push({ ratingAfter: player.rating, result: player.result, opponentRating: opponent.rating });
                    if (isWin) d.wins++;
                    else if (['agreed', 'repetition', 'stalemate', 'insufficient', '50move'].includes(player.result)) d.draws++;
                    else d.losses++;
                    d.opponentRatingSum += opponent.rating;
                });

                const sortedDays = Array.from(dailyMap.values()).sort((a,b) => a.date.localeCompare(b.date));
                let prevClose = sortedDays.length > 0 ? sortedDays[0].games[0].ratingAfter : 1200;

                const chartData = sortedDays.map(day => {
                    const volume = day.games.length;
                    const open = prevClose;
                    const close = day.games[volume - 1].ratingAfter;
                    const high = Math.max(open, ...day.games.map(g => g.ratingAfter));
                    const low = Math.min(open, ...day.games.map(g => g.ratingAfter));
                    prevClose = close;
                    return {
                        x: new Date(day.date).getTime(),
                        y: [open, high, low, close],
                        volume,
                        perfRating: Math.round((day.opponentRatingSum + 400 * (day.wins - day.losses)) / volume),
                        wins: day.wins, losses: day.losses, draws: day.draws,
                        netChange: close - open
                    };
                });

                setStats({
                    chartData, timeStats, totalGames: filtered.length,
                    winRateGlobal: ((filtered.filter(g => winCodes.includes(g.white.username.toLowerCase() === username.toLowerCase() ? g.white.result : g.black.result)).length / filtered.length) * 100).toFixed(1),
                    currentRating: chartData[chartData.length - 1].y[3],
                    highestRating: Math.max(...chartData.map(d => d.y[1])),
                    lowestRating: Math.min(...chartData.map(d => d.y[2]))
                });
            }, [rawGames, timeControl, username]);

            const handleAiAnalyze = async (apiKey, modelName, customInstruction) => {
                setAiAnalyzing(true); setAiError(null);
                try {
                    const res = await fetchGeminiAnalysis(apiKey, stats, username, timeControl, modelName, customInstruction);
                    setAiAnalysis(res);
                } catch (err) { setAiError(err.message); } finally { setAiAnalyzing(false); }
            };

            const candleOptions = {
                chart: { id: 'rating-candles', type: 'candlestick', background: 'transparent', toolbar: { show: false } },
                theme: { mode: 'dark' },
                xaxis: { type: 'datetime' },
                yaxis: { title: { text: 'Rating' } },
                grid: { borderColor: '#334155', strokeDashArray: 4 },
                plotOptions: { candlestick: { colors: { upward: '#22c55e', downward: '#ef4444' } } }
            };

            const perfOptions = {
                chart: { type: 'line', background: 'transparent', toolbar: { show: false } },
                theme: { mode: 'dark' },
                stroke: { width: [3, 0], curve: 'smooth' },
                xaxis: { type: 'datetime' },
                yaxis: [
                    { title: { text: 'Performance Rating', style: { color: '#fbbf24' } }, labels: { style: { colors: '#fbbf24' } } },
                    { opposite: true, title: { text: 'Number of Games', style: { color: '#a78bfa' } }, labels: { style: { colors: '#a78bfa' } } }
                ],
                colors: ['#fbbf24', '#a78bfa'],
                grid: { borderColor: '#334155', strokeDashArray: 4 },
                legend: { position: 'top' }
            };

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-8">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-white tracking-tight">Chess Performance Dashboard</h1>
                            <p className="text-slate-400 text-sm">Analytics & Behavioral Patterns</p>
                        </div>
                        
                        <div className="flex flex-wrap gap-3 items-end bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-xl">
                            <div>
                                <label className="block text-xs text-slate-400 mb-1 uppercase">Username</label>
                                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="bg-slate-900 border border-slate-600 text-white px-3 py-1.5 rounded w-32 md:w-40 focus:border-emerald-500 outline-none" placeholder="username" />
                            </div>
                            <div>
                                <label className="block text-xs text-slate-400 mb-1 uppercase">Mode</label>
                                <select value={timeControl} onChange={(e) => setTimeControl(e.target.value)} className="bg-slate-900 border border-slate-600 text-white px-3 py-1.5 rounded focus:border-emerald-500 outline-none">
                                    <option value="rapid">Rapid</option><option value="blitz">Blitz</option><option value="bullet">Bullet</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs text-slate-400 mb-1 uppercase">Duration</label>
                                <select value={monthsBack} onChange={(e) => setMonthsBack(Number(e.target.value))} className="bg-slate-900 border border-slate-600 text-white px-3 py-1.5 rounded focus:border-emerald-500 outline-none">
                                    <option value="1">1 Month</option><option value="3">3 Months</option><option value="6">6 Months</option><option value="12">1 Year</option>
                                </select>
                            </div>
                            <button onClick={handleFetch} disabled={loading || !username} className="bg-emerald-600 hover:bg-emerald-500 px-5 py-1.5 rounded font-bold h-[34px] transition-colors active:scale-95">Analyze</button>
                        </div>
                    </header>

                    {error && <div className="bg-red-500/10 border border-red-500/50 text-red-200 p-4 rounded-xl mb-8 text-center text-sm">{error}</div>}
                    {loading && <div className="flex flex-col items-center justify-center py-20 animate-pulse"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-500 mb-4"></div><p className="text-emerald-500 font-bold uppercase tracking-widest text-xs">Fetching Archives...</p></div>}

                    {!loading && stats && (
                        <div className="space-y-8 animate-in fade-in duration-700">
                            <div className="flex justify-between items-center bg-gradient-to-r from-slate-800 to-slate-900 p-4 rounded-xl border border-slate-700 shadow-lg">
                                <div className="flex items-center gap-3">
                                    <div className="bg-purple-500/20 p-2 rounded-lg text-purple-400"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg></div>
                                    <div><h3 className="font-semibold text-white text-base">AI Coach Analysis</h3><p className="text-xs text-slate-400">Ask the AI about your patterns</p></div>
                                </div>
                                <button onClick={() => setIsAiOpen(true)} className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg shadow-purple-900/20 transition-all active:scale-95">Ask AI Coach</button>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <Card className="border-l-4 border-emerald-500"><StatBox label="Current" value={stats.currentRating} subtext={`Peak: ${stats.highestRating}`} color="text-emerald-400" /></Card>
                                <Card className="border-l-4 border-blue-500"><StatBox label="Games" value={stats.totalGames} subtext="Selected Period" color="text-blue-400" /></Card>
                                <Card className="border-l-4 border-amber-500"><StatBox label="Win Rate" value={`${stats.winRateGlobal}%`} subtext="Success Average" color="text-amber-400" /></Card>
                                <Card className="border-l-4 border-purple-500"><StatBox label="Floor" value={stats.lowestRating} subtext="Period Low" color="text-purple-400" /></Card>
                            </div>

                            <ChartSection title="Rating History (OHLC)"><ReactApexChart options={candleOptions} series={[{ data: stats.chartData }]} type="candlestick" height={350} /></ChartSection>
                            <ChartSection title="Performance Rating vs Game Volume">
                                <ReactApexChart options={perfOptions} series={[{ name: 'Perf Rating', type: 'line', data: stats.chartData.map(d => ({ x: d.x, y: d.perfRating })) }, { name: 'Games Played', type: 'column', data: stats.chartData.map(d => ({ x: d.x, y: d.volume })) }]} type="line" height={400} />
                            </ChartSection>

                            <Card>
                                <h3 className="text-lg font-semibold mb-4 text-slate-200">Daily Detail</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-400 uppercase bg-slate-800 sticky top-0">
                                            <tr><th className="px-4 py-3">Date</th><th className="px-4 py-3">Vol</th><th className="px-4 py-3">Perf</th><th className="px-4 py-3">Hi/Lo</th><th className="px-4 py-3 text-right">Net</th></tr>
                                        </thead>
                                        <tbody>
                                            {[...stats.chartData].reverse().map((day) => (
                                                <tr key={day.x} className="border-b border-slate-800 hover:bg-slate-800/50">
                                                    <td className="px-4 py-3 font-mono text-slate-300 whitespace-nowrap text-xs">{new Date(day.x).toLocaleDateString(undefined, {weekday: 'short', month:'short', day:'numeric'})}</td>
                                                    <td className="px-4 py-3 text-blue-400 font-bold">{day.volume}</td>
                                                    <td className="px-4 py-3 text-amber-400 font-bold">{day.perfRating}</td>
                                                    <td className="px-4 py-3 text-[10px] text-slate-400"><span className="text-green-500">{day.y[1]}</span> / <span className="text-red-500">{day.y[2]}</span></td>
                                                    <td className={`px-4 py-3 text-right font-mono text-xs ${day.netChange >= 0 ? 'text-green-400' : 'text-red-400'}`}>{day.netChange > 0 ? '+' : ''}{day.netChange}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </div>
                    )}

                    <AiModal isOpen={isAiOpen} onClose={() => setIsAiOpen(false)} onAnalyze={handleAiAnalyze} isAnalyzing={aiAnalyzing} analysis={aiAnalysis} error={aiError} />
                    {!loading && !stats && !error && <div className="text-center text-slate-500 mt-20 opacity-50 text-sm"><p>Enter a username to begin analysis.</p></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
